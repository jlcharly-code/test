<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Mes travaux d'édition{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/template.css') }}">
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">Mes travaux d'édition</h1>
      <figure>
        <img class="cover-img" src="https://res.cloudinary.com/dxcap6jy/image/upload/v1788026781/project_images/livre_ouvert_i8pxhi.jpg" />
      </figure>
      <nav>
        <ul class="menu">
          <li><a href="{{ url_for('home') }}">Première partie: Livres</a></li>
          <li><a href="{{ url_for('templiers') }}">Seconde partie: PDF's</a></li>
          <li><a href="{{ url_for('about') }}">Au sujet du site</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Le contenu des autres pages s'insère ici -->
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
